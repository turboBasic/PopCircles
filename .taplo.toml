# Without an explicit include, taplo walks every .toml it can reach — including the
# thousands under .venv and build.
include = ["*.toml", "crates/*/*.toml", "data/*.toml", ".github/**/*.toml", ".codex/agents/*.toml"]
exclude = [".venv/**", "build/**", "**/site-packages/**"]

[formatting]
# Task and dependency lists stay one-per-line: collapsing them makes diffs noisier than
# the space saved is worth.
array_auto_collapse = false
column_width = 100
indent_string = "  "
