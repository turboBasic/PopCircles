version: "0.2"
language: en,en-GB
caseSensitive: false

dictionaryDefinitions:
  - name: project
    path: .cspell/project.txt
    description: names, tooling and identifiers specific to this repository
    addWords: true

dictionaries:
  - project
  - bash
  - companies
  - computing-acronyms
  - en-common-misspellings
  - filetypes
  - git
  - python
  - rust
  - shellscript
  - softwareTerms
  - software-tools

ignorePaths:
  - .git/**
  - .cspell/**
  - build/**
  - results/country-*-half.json # Generated country names come from the boundary data.
  - "**/__pycache__/**"
  - "**/.venv/**"
  - uv.lock
  - Cargo.lock
  - "**/*.{png,svg,ico,tif,tiff,bin}"

ignoreRegExpList:
  - /\b[0-9a-f]{7,40}\b/ # git object hashes and pinned action SHAs
  - /(?<=https?:\/\/)\S+/ # URLs

overrides:
  - filename: "**/*.py"
    dictionaries:
      - python
  - filename: "**/*.rs"
    dictionaries:
      - rust
