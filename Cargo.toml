[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.dependencies]
anyhow = "1"
# The `must_cast` feature is what makes the f64-to-bytes direction a compile-time guarantee rather
# than a runtime panic path: the sizes divide and the alignment falls, and `must_cast_slice` refuses
# to compile where that is not so.
bytemuck = { version = "1", features = ["must_cast"] }
clap = { version = "4", default-features = false, features = [
  "std",
  "derive",
  "help",
  "usage",
  "error-context",
] }
insta = { version = "1", features = ["json", "redactions"] }
# `std` is what the CLI's own subscriber costs, not what the crate requires: `set_boxed_logger` and
# `impl Error for SetLoggerError` are both behind it, and `log` enables no features by default, so a
# boxed logger whose install is a handled `Result` does not compile without it. `std = []` in log's
# manifest, so it pulls nothing.
log = { version = "0.4", features = ["std"] }
memmap2 = "0.9"
proptest = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
# Parse only: the CLI reads `data/registry.toml` and writes nothing back, so the writing half and the
# format-preserving edit machinery are features nothing here reaches.
toml = { version = "1.1", default-features = false, features = ["parse", "serde"] }
# The trimmed feature set is ADR 0003's ruling, not a default: deflate, fax and jpeg are decode
# paths a Float32 population raster cannot reach, and enabling one costs eleven more crates.
tiff = { version = "0.11", default-features = false, features = ["lzw"] }
# 0.1 rather than the current 0.2, because the point of it is to compress test fixtures with the
# same implementation tiff decompresses them with, and tiff 0.11 depends on 0.1.
weezl = "0.2"

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/turboBasic/PopulationCircles2026"
authors = ["turboBasic"]

[workspace.lints.rust]
# deny rather than forbid, and the difference is the whole point: `forbid` cannot be overridden by an
# `#[allow]` at all, so the one `unsafe` block ADR 0006 accepts — `memmap2::Mmap::map` is an
# unsafe fn and cannot be otherwise — is a change to this line rather than a local exception to it. What
# replaces the guarantee `forbid` was making is the `single-unsafe-allow` hook, which asserts the count
# of exceptions under `crates/` is exactly one and that it is the site that record names.
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# warn, not deny: every numeric conversion should be a decision with a stated reason, and denying
# these would push authors toward a blanket allow instead of that reason.
cast_possible_truncation = "warn"
cast_precision_loss = "warn"
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
codegen-units = 1
lto = "thin"
