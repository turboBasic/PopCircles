[project]
name = "population-circles-tools"
version = "0.0.0"
description = "Data preparation and map rendering tooling for PopulationCircles2026"
requires-python = ">=3.14"
dependencies = []

# The three repository tools reach their subjects through REPO_ROOT rather than an argument, so an
# entry point is what lets a hook and a mise task call one without naming where its file sits.
[project.scripts]
circle-map = "population_circles.circle_map:main"
capture-agent-answer = "repo_tools.capture_agent_answer:main"
fetch-data = "repo_tools.fetch_data:main"
lint-docs = "repo_tools.lint_docs:main"
lint-version-bumps = "repo_tools.lint_version_bumps:main"
post-agent-answer = "repo_tools.post_agent_answer:main"
release-smoke = "repo_tools.release_smoke:main"
release-trust = "repo_tools.release_trust:main"
render-gallery = "population_circles.gallery:main"
render-map = "population_circles.render_map:main"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

# Two packages in one project: uv_build takes `module-name` as a list, so both land in one wheel and
# one editable install rather than each needing a project of its own.
[tool.uv.build-backend]
module-root = "python/src"
module-name = ["population_circles", "repo_tools"]

[dependency-groups]
dev = [
  "matplotlib>=3.11.1",
  "pydantic>=2.13.4",
  "pyproj>=3.7.2",
  "pyright>=1.1.407",
  "pytest>=9.0.2",
  "ruff>=0.16.2",
  "shapely>=2.1.2",
]

[tool.ruff]
line-length = 100
target-version = "py314"
# Beside cargo's target directory, which mise.toml sends here for the same reason.
cache-dir = "build/ruff"
# What INP001 reads to decide a directory is a root rather than a namespace package leaking. Naming
# python/tests here is what makes that lint correct about a test directory with no __init__.py,
# instead of it being silenced per-file.
src = ["python/src", "python/tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "COM812", # conflicts with the formatter
  "CPY",    # no copyright headers anywhere in this repo
  "D",      # docstrings are not used in this repo
  # docs/ai/code.md: "No if TYPE_CHECKING: guard except to break an import cycle" — TC
  # exists to move imports behind that guard for other reasons, which this repo doesn't want.
  "TC",
]

[tool.ruff.lint.per-file-ignores]
"python/src/population_circles/gallery.py" = [
  "T201", # what was drawn and what was skipped is this command's output, not debug printing
]
"python/src/population_circles/render_map.py" = [
  "T201", # the path a figure was written to is this command's output, not debug printing
]
"python/src/repo_tools/*.py" = [
  "T201", # a lint script's findings are its output, not incidental debug printing
]
"python/tests/*.py" = [
  "S101", # assert is how pytest asserts
]

[tool.ruff.lint.isort]
known-first-party = ["population_circles", "repo_tools"]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.14"
venvPath = "."
venv = ".venv"
# Not redundant next to module-root and ruff's src: pyright does not read .gitignore, so without a
# scope it walks the whole tree and a scratch script under tmp/ fails a required check. An allow-list
# rather than an exclude of tmp/ because platform.md's Structure declares python/ the only Python
# root — the cost is that a second root would go unchecked silently rather than failing loudly.
include = ["python"]

[tool.pytest.ini_options]
# `-m "not raster"` is what keeps the suite runnable on a clone with no raster in it, which is every
# clone CI makes. `mise run test:python-raster` passes its own `-m` to override.
addopts = "-ra --strict-markers --strict-config -m 'not raster'"
cache_dir = "build/pytest"
markers = ["raster: needs fetched raster content, so never runs in CI"]
testpaths = ["python/tests"]
