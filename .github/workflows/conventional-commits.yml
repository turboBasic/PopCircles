name: 🌜 conventional-commits

# pull_request, not pull_request_target: the called workflow's jobs run only on pull_request,
# and a job that does not run is reported as skipped rather than failed, so nothing would say
# the messages went unchecked. That event also checks out the base branch, which would leave
# the range of commits to check empty.
on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  commits:
    uses: turboBasic/github-actions/.github/workflows/conventional-commits.yml@v0.4
    permissions:
      contents: read
      pull-requests: read
