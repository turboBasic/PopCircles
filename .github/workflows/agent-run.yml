# Separate from `agent.yml`: an `issue_comment` workflow only ever runs the default branch's copy, so a
# single-file design could not be tested until already merged. `workflow_dispatch` is the escape hatch.

name: 🌜 agent-run

on:
  workflow_call:
    inputs:
      instruction:
        description: What the agent is asked to do
        required: true
        type: string
      issue:
        description: The issue the run belongs to, which names its branch
        required: false
        type: number
      model:
        description: An opencode provider/model identifier
        required: false
        type: string
        default: openrouter/deepseek/deepseek-v4-pro-0813
    # Declared one by one so a caller passes them explicitly, which is what makes this workflow's whole
    # credential surface readable from its own signature. A dispatched run reads the same three from the
    # repository directly.
    secrets:
      AGENT_APP_ID:
        required: true
      AGENT_APP_PRIVATE_KEY:
        required: true
      OPENROUTER_API_KEY:
        required: true
  workflow_dispatch:
    inputs:
      instruction:
        description: What the agent is asked to do
        required: true
        type: string
      issue:
        description: The issue the run belongs to, which names its branch
        required: false
        type: number
      model:
        description: An opencode provider/model identifier
        required: false
        type: string
        default: openrouter/deepseek/deepseek-v4-pro-0813

# Every write in this workflow goes through the App installation token, never GITHUB_TOKEN: a pull request
# opened with GITHUB_TOKEN creates no workflow run, so two of main's three required checks would never
# report on it and the result would be unmergeable by everyone but the one bypass actor.
permissions: {}

jobs:
  agent:
    runs-on: ubuntu-26.04
    timeout-minutes: 30

    # Not cancel-in-progress: a cancelled run leaves a half-written branch behind, which is worse than
    # making the second invocation wait.
    concurrency:
      group: agent-${{ inputs.issue || github.run_id }}
      cancel-in-progress: false

    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ secrets.AGENT_APP_ID }}
          private-key: ${{ secrets.AGENT_APP_PRIVATE_KEY }}

      # persist-credentials is left at its default here, where ci.yml turns it off: this job pushes a
      # branch and opens a pull request, so the token has to survive the checkout into the git steps.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2

      - name: Sync Python tooling
        run: uv sync --locked

      # The bot's numeric id is only discoverable from the API — it's what makes a commit attributable
      # to the App rather than an address nothing owns. Resumed from `origin/$branch` where one already
      # exists, so iterating on one issue is additive; starting over means deleting the branch.
      - name: Identify as the App and branch
        id: branch
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SLUG: ${{ steps.app-token.outputs.app-slug }}
          ISSUE: ${{ inputs.issue }}
          RUN_ID: ${{ github.run_id }}
        run: |
          bot_id=$(gh api "/users/${SLUG}[bot]" --jq .id)
          git config user.name "${SLUG}[bot]"
          git config user.email "${bot_id}+${SLUG}[bot]@users.noreply.github.com"
          branch="agent/${ISSUE:-run-${RUN_ID}}"
          if git fetch --quiet origin "$branch" 2>/dev/null; then
            echo "Resuming $branch, which already exists on the remote."
            git switch -c "$branch" FETCH_HEAD
          else
            git switch -c "$branch"
          fi
          echo "name=$branch" >> "$GITHUB_OUTPUT"

      # GitHub's expression language can neither trim nor replace, so the `/agent` strip and the
      # issue-body fallback happen here in shell instead. A file, not a step output: an instruction is
      # arbitrary text, and a heredoc-delimited output breaks on text containing the delimiter.
      - name: Resolve the instruction
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RAW: ${{ inputs.instruction }}
          ISSUE: ${{ inputs.issue }}
        run: |
          instruction=$(printf '%s' "$RAW" | sed -E '1s|^[[:space:]]*/agent[[:space:]]*||')
          if [ -z "$(printf '%s' "$instruction" | tr -d '[:space:]')" ]; then
            [ -n "$ISSUE" ] || { echo "::error::No instruction, and no issue to take one from."; exit 1; }
            instruction=$(gh issue view "$ISSUE" --json body --jq .body)
          fi
          printf '%s' "$instruction" > "$RUNNER_TEMP/instruction.txt"

      # The instruction reaches the agent through the environment, not the script's text — it originates
      # in a comment body, and interpolating one into a run block is remote code execution by whoever
      # wrote the comment. `--auto` auto-approves only what `opencode.json`'s deny list does not refuse,
      # which is what keeps committing, pushing and opening the pull request off this step.
      - name: Run the agent
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MODEL: ${{ inputs.model }}
        run: opencode run --auto --model "$MODEL" "$(cat "$RUNNER_TEMP/instruction.txt")"

      # Reads the session back rather than this step's own stdout — the pretty terminal rendering has
      # no reliable seam to cut the final answer from. `AGENT_SECRET_OPENROUTER_API_KEY` is the scrub
      # twin `repo_tools.redact` matches by prefix, not the real credential: this step makes no API
      # call, so it never needs one. continue-on-error for the same reason as "Run the gates" below.
      - name: Capture the agent's answer
        continue-on-error: true
        env:
          AGENT_SECRET_OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: uv run capture-agent-answer

      # Before the gates, not tidiness: `prek run --all-files` reads the git index, so an untracked
      # file the agent wrote is invisible to every hook until it is staged.
      - name: Stage what the agent changed
        id: staged
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "The agent changed nothing."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Only the no-diff branch: a diff gets its answer in the pull request body below, and a comment
      # here would say the same thing twice.
      - name: Post the answer to the issue
        if: steps.staged.outputs.changed == 'false' && inputs.issue
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          # The scrub twin of the token above — see the comment on the step that captured the answer.
          AGENT_SECRET_GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ISSUE: ${{ inputs.issue }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: uv run post-agent-answer

      # continue-on-error: a red gate is a result this run reports, not a reason to end without one.
      # `shell: bash` supplies pipefail, without which `tee` would mask the status this step is judged on.
      - name: Run the gates
        id: gates
        continue-on-error: true
        shell: bash
        run: mise run ci 2>&1 | tee "$RUNNER_TEMP/ci.log"

      # The message is composed here rather than left to the agent because main's ruleset checks it:
      # commitizen runs over every commit in the pull request, so a message the agent improvised would
      # block its own branch.
      - name: Commit and push
        if: steps.staged.outputs.changed == 'true'
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
        run: |
          subject=$(head -n 1 "$RUNNER_TEMP/instruction.txt" | cut -c1-64)
          # Staged again, because the formatting hooks in `mise run ci` rewrite files rather than only
          # reporting on them, so the gate may have left changes of its own.
          git add -A
          git commit -m "chore(agent): ${subject}"
          git push -u origin "$BRANCH"

      # No --base: gh defaults to the repository's default branch. What keeps the agent off that branch is
      # the ruleset, which refuses a direct push from an actor holding no bypass — not the absence of the
      # word here.
      - name: Open the draft pull request
        if: steps.staged.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          MODEL: ${{ inputs.model }}
          BRANCH: ${{ steps.branch.outputs.name }}
          GATES: ${{ steps.gates.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          subject=$(head -n 1 "$RUNNER_TEMP/instruction.txt" | cut -c1-64)
          body="$RUNNER_TEMP/pr-body.md"
          cat > "$body" <<EOF
          \`mise run ci\` on this branch: **${GATES}**. Read that before the diff — a failed gate here is the agent reporting its own failure rather than hiding it.

          **Model:** \`${MODEL}\`

          **Instruction**

          EOF
          sed 's/^/> /' "$RUNNER_TEMP/instruction.txt" >> "$body"
          if [ "$GATES" != success ] && [ -f "$RUNNER_TEMP/ci.log" ]; then
            {
              printf '\n<details><summary>What <code>mise run ci</code> reported</summary>\n\n```\n'
              sed -r 's/\x1b\[[0-9;]*m//g' "$RUNNER_TEMP/ci.log" | tail -n 40
              printf '```\n\n</details>\n'
            } >> "$body"
          fi
          printf '\n\n[The run that produced this](%s)\n' "$RUN_URL" >> "$body"
          # A resumed branch already has its pull request, and `gh pr create` fails outright while one is
          # open for the same head. The body is the newest run's, so the report at the top describes the
          # commits now on the branch rather than the first attempt's.
          if [ "$(gh pr list --head "$BRANCH" --state open --json number --jq 'length')" = 0 ]; then
            gh pr create --draft --head "$BRANCH" \
              --title "chore(agent): ${subject}" --body-file "$body"
          else
            gh pr edit "$BRANCH" --body-file "$body"
            gh pr comment "$BRANCH" --body "Another run pushed to this branch. The description above is now that run's."
          fi
