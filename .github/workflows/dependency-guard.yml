name: 🌜 dependency-guard

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  # An advisory should not block unrelated pull requests before a maintainer reviews it.
  guard:
    permissions:
      contents: read
    uses: turboBasic/github-actions/.github/workflows/dependency-review.yml@v0.4
