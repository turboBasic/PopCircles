name: 🧩 build-binaries

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    # Generous rather than derived: the release profile — codegen-units = 1, thin LTO — is compiled on
    # macOS here and nowhere else, so nothing has measured what it costs there.
    timeout-minutes: 30
    strategy:
      # With fail-fast a break on one leg cancels the other, and the macOS leg is the one no other
      # workflow compiles, so its failure is the one worth seeing whole.
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            triple: aarch64-apple-darwin
          - runner: ubuntu-26.04
            triple: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3

      # No cargo cache: this artifact is downloaded and run by someone who cannot inspect what produced
      # it, so the full compile is worth not having to reason about what a restored `target` contributed.
      - run: mise run build

      - name: Name the artifact by its target triple, with its checksum beside it
        env:
          TRIPLE: ${{ matrix.triple }}
        run: |
          set -euo pipefail
          cd build/target/release
          mv popcircles "popcircles-$TRIPLE"
          # sha256sum on the Linux runner, shasum on macOS, which ships no sha256sum.
          if command -v sha256sum > /dev/null 2>&1; then
            sha256sum "popcircles-$TRIPLE" > "popcircles-$TRIPLE.sha256"
          else
            shasum -a 256 "popcircles-$TRIPLE" > "popcircles-$TRIPLE.sha256"
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: popcircles-${{ matrix.triple }}
          path: |
            build/target/release/popcircles-${{ matrix.triple }}
            build/target/release/popcircles-${{ matrix.triple }}.sha256
          # A leg that built nothing must not reach publish as an empty upload.
          if-no-files-found: error
