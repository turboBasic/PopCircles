name: 🌜 gallery
run-name: Gallery ${{ inputs.asset_name }}

on:
  workflow_dispatch:
    inputs:
      asset_name:
        description: Exact gallery ZIP asset on the gallery-handoff draft release
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: gallery-pages
  cancel-in-progress: true

jobs:
  gallery:
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7

      - name: Stage the selected gallery
        run: mise run gallery:stage -- "$ASSET_NAME"
        env:
          ASSET_NAME: ${{ inputs.asset_name }}
          GH_TOKEN: ${{ github.token }}

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/gallery

      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      - name: Clean superseded gallery assets
        run: mise run gallery:cleanup -- "$ASSET_NAME"
        env:
          ASSET_NAME: ${{ inputs.asset_name }}
          GH_TOKEN: ${{ github.token }}
