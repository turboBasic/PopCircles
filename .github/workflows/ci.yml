# What CI runs is this repository's own `lint`, `typecheck` and `test` tasks, so it cannot drift from
# `mise run ci`. The reusable workflow owns caches; paths that differ from language defaults are passed
# here because a caller cannot add a step to a job it does not own.

name: 🌜 ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # The id names the component and composes the required context `popcircles / project-ci`. One
  # component, Rust and Python together, which is why it is named after neither.
  popcircles:
    uses: turboBasic/github-actions/.github/workflows/project-ci.yml@v0.4
    permissions:
      contents: read
    with:
      # build-binaries.yml builds the release binary and release-smoke.yml proves it; a build stage here
      # would compile the same tree again.
      run-build: false
      # Match .cargo/config.toml so the reusable workflow caches the target directory Cargo uses.
      cargo-target-cache-path: build/target

  playwright-failure-traces:
    if: failure()
    needs: [popcircles]
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8

      - name: Replay frontend tests
        run: mise run test:frontend

      - name: Upload Playwright failure traces
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-failure-traces
          path: frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7
