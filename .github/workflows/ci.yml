# What CI runs is this repository's own `lint`, `typecheck` and `test` tasks, so it cannot drift from
# `mise run ci`. Nothing caches a compile here: the called workflow caches its hook runner and no other
# path, and a caller cannot add a step to a job it does not own.

name: 🌜 ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # The id names the component and composes the required context `popcircles / project-ci`. One
  # component, Rust and Python together, which is why it is named after neither.
  popcircles:
    uses: turboBasic/github-actions/.github/workflows/project-ci.yml@v0.4
    permissions:
      contents: read
    with:
      # build-binaries.yml builds the release binary and release-smoke.yml proves it; a build stage here
      # would compile the same tree again.
      run-build: false
