name: 🌜 release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

# Cancelling mid-upload can leave an incomplete draft requiring maintainer cleanup.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The authorizer must come from main, never from the commit being authorized: the only non-owner
  # writer is the GitHub App, and it can edit any branch but main. A tag naming an App-edited commit
  # would otherwise run a gate that commit wrote. A job of its own keeps the event commit's checkout
  # and toolchain off this runner.
  authorize:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1

      - name: Authorize the signed release tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          uv sync --locked
          mise run release:trust -- tag --tag "$TAG" --commit "$COMMIT"

  # A tag can name any commit, and main's required checks say nothing about the one it points at.
  # Checking before the build costs a slow release; skipping it risks one that cannot be recalled.
  gate:
    needs: authorize
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1

      - name: Sync Python tooling
        run: uv sync --locked

      # The binary stamps its manifest version into every document, so a tag naming another version
      # ships documents pointing at a release that does not exist. cargo answers rather than a grep,
      # because the version is inherited from the workspace and this manifest does not carry it.
      - name: The tag names the version the manifest carries
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(cargo metadata --format-version 1 --no-deps \
            | jq -r '.packages[] | select(.name == "popcircles-cli") | .version')"
          if [ "$TAG" != "v$version" ]; then
            echo "the tag is $TAG and the manifest carries $version:" \
              "this tag would publish a binary reporting popcircles $version" >&2
            exit 1
          fi
          echo "the tag $TAG agrees with the manifest's $version"

      - run: mise run ci

  build:
    needs: gate
    uses: ./.github/workflows/build-binaries.yml

  attest:
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1

      - name: Sync Python tooling
        run: uv sync --locked

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: popcircles-*
          path: dist
          merge-multiple: true

      - name: Confirm the four-file payload inventory
        run: mise run release:trust -- assets --directory dist

      - name: Attest the four payloads
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            dist/popcircles-aarch64-apple-darwin
            dist/popcircles-x86_64-unknown-linux-gnu
            dist/popcircles-aarch64-apple-darwin.sha256
            dist/popcircles-x86_64-unknown-linux-gnu.sha256

      - name: Verify every subject against the bundle
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          cp "${{ steps.attest.outputs.bundle-path }}" dist/provenance.sigstore.json
          mise run release:trust -- assets --directory dist \
            --bundle dist/provenance.sigstore.json --tag "$TAG" --commit "$COMMIT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: |
            dist/popcircles-aarch64-apple-darwin
            dist/popcircles-x86_64-unknown-linux-gnu
            dist/popcircles-aarch64-apple-darwin.sha256
            dist/popcircles-x86_64-unknown-linux-gnu.sha256
            dist/provenance.sigstore.json
          if-no-files-found: error

  publish:
    needs: attest
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1

      - name: Sync Python tooling
        run: uv sync --locked

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: dist

      # No --generate-notes: the notes have to say that the wire format's schema_version still holds
      # and that a cache this release invalidates will be rebuilt, neither of which follows from the
      # merged PRs since the last tag. The body is created empty for a maintainer to write.
      #
      # --draft because that maintainer writes it after this job, so without it the window between the
      # two is a published release promising nothing. A draft is not visible to a fetcher and can be
      # deleted, so the version is not spent until someone publishes it, which is
      # `gh release edit <tag> --draft=false` once the body says what it has to.
      - name: Attach the attested payloads to a draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          mise run release:trust -- publish --directory dist \
            --bundle dist/provenance.sigstore.json --tag "$TAG" --commit "$COMMIT"
