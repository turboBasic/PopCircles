[package]
name = "popcircles-cli"
version.workspace = true
description = "CLI for finding the smallest circle on Earth containing a given share of world population"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
# The same rule the library carries: this crate cannot be published without
# the library going first, and neither is going.
publish = false

# Without this the file takes the package name, and every document the CLI writes
# already reports `popcircles`. It is also what fixes the usage line, which clap takes from the binary
# rather than from `#[command(name = ...)]`.
[[bin]]
name = "popcircles"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
clap.workspace = true
# Both ends of the facade: this crate emits its own records and implements the `log::Log` that consumes
# every crate's.
log.workspace = true
popcircles = { path = "../popcircles" }
# Deriving the registry's rows, not a document this crate publishes: `report.rs` owns the wire format and
# is the library's only serde surface.
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tempfile.workspace = true
toml.workspace = true
ureq.workspace = true

# `tests/commands.rs` builds a real cache to run the binary against, and a temporary directory is what
# keeps that out of the working tree. `tests/help.rs` pins every help surface, which is eleven strings no
# one wants to read inline. The binary itself is reached through `CARGO_BIN_EXE_*`, which is std, so no
# command runner is needed.
[dev-dependencies]
insta.workspace = true
