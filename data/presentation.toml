[map_sources]
terrain_default = "etopo-2022-60s"
lakes = "natural-earth-10m-lakes-v5.0.0"
rivers = "natural-earth-10m-rivers-lake-centerlines-v5.0.0"
roads = "natural-earth-10m-roads-v5.0.0"
places = "populated-places-1to10m"

[map_sources.terrain_overrides]
CH = "swisstopo-dhm25-200m"

[country_maps]
default_projection = "orthographic"

[country_maps.US]
projection = "orthographic"

# Parameters are named for the selected projection. The rectangle uses its output x/y units.
[country_maps.US.projection_parameters]
lon_0 = -96.0
lat_0 = 44.0

# Orthographic coordinates in metres; these reproduce the current USA image rectangle.
[country_maps.US.extent]
units = "metres"
x_min = -5397723.3
y_min = -2111802.2
x_max = 2419813.8
y_max = 3835144.3

[country_maps.RU]
projection = "albers-equal-area"

[country_maps.RU.projection_parameters]
lon_0 = 100.0
lat_0 = 55.0
lat_1 = 50.0
lat_2 = 70.0

[country_maps.FR]
projection = "plate-carree"

[country_maps.FR.extent]
units = "degrees"
x_min = -6.0
y_min = 41.0
x_max = 10.0
y_max = 52.0

