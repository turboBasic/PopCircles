[country_maps]
default_projection = "orthographic"

[country_maps.US]
projection = "orthographic"

# Parameters are named for the selected projection. The rectangle uses its output x/y units.
[country_maps.US.projection_parameters]
lon_0 = -96.0
lat_0 = 44.0

# Orthographic coordinates in metres; these reproduce the current USA image rectangle.
[country_maps.US.extent]
units = "metres"
x_min = -5397723.3
y_min = -2111802.2
x_max = 2419813.8
y_max = 3835144.3

[country_maps.RU]
projection = "albers-equal-area"

[country_maps.RU.projection_parameters]
