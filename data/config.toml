# Built-in defaults and prepared country combinations. Dataset names refer to registry entries.

[defaults]
population_dataset = "population-count-2020-30arcsec"
country_combination = "gpw-2020-gisco-2024"

[combinations.gpw-2020-gisco-2024]
population_source = "dataset:population-count-2020-30arcsec"
boundary_source = "dataset:gisco-countries-2024-1m"
default_resolution = 10
provenance = "Project baseline combination"
attribution = "GPWv4.11 population count; GISCO Countries 2024 boundaries."

[combinations.gpw-2020-gisco-2024.resolutions.1]
local = "out/countries/gpw-2020-gisco-2024/1"

[combinations.gpw-2020-gisco-2024.resolutions.10]
local = "out/countries/gpw-2020-gisco-2024/10"
