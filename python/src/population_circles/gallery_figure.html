<figure class="map-card"{% if one.country_id %} data-country-id="{{ one.country_id }}"{% endif %}>
  <a class="map-link" href="{{ one.figure.name }}"><img {% if one.country_id %}data-src="{{ one.figure.name }}"{% else %}src="{{ one.figure.name }}"{% endif %} alt="{{ one.figure.stem }}" loading="lazy">{% if one.country_id %}<noscript><img src="{{ one.figure.name }}" alt="{{ one.figure.stem }}" loading="lazy"></noscript>{% endif %}</a>
  <figcaption><a href="{{ one.document.name }}">View result data</a></figcaption>
</figure>
