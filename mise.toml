[tools]
# clippy and rustfmt are named explicitly because CI's default profile omits them; rust-src
# gives rust-analyzer the standard library sources for the same pinned toolchain.
rust = { version = "1.99.1", components = ["clippy", "rustfmt", "rust-src"] }
python = "3.14"
uv = "latest"
prek = "latest"
actionlint = "latest"
shellcheck = "latest"
taplo = "latest"
node = "24.19.0"
"npm:markdownlint-cli2" = "0.23.2"
"npm:cspell-cli" = "10.0.1"
# Not `npm:opencode-ai`: that package's postinstall fetches the real binary, and mise's npm backend
# runs no postinstall. `aqua:anomalyco/opencode` fetches the platform binary directly. Pinned exactly,
# where most tools here take `latest` — this one decides what a workflow does, not whether a file is
# formatted, so a moving version would produce a run nobody could reproduce.
opencode = "1.18.18"

[env]
_.python.venv = { path = ".venv", create = true }

[tasks.setup]
description = "Install dependencies and git hooks"
depends = ["deps"]
run = [
  "prek install",
  # Not a second `depends`: it has to follow `prek install`.
  "mise run git:ff-only",
]

# The leaves depend on this, never `lint`/`typecheck`/`test`: `depends` runs in parallel and would race.
[tasks.deps]
description = "Fetch the Rust and Python dependencies"
run = [
  "cargo fetch",
  "uv sync --locked",
]

# A guardrail, not a gate — `git merge --no-ff` still overrides it — that makes an accidental merge
# fail earlier, at `git pull` on a diverged branch, while nothing pushed needs rewriting. Repo-local,
# since a developer's own global preference is theirs to set. `fetch.prune` rides along: the repository
# deletes a head branch on merge, and without this the tracking ref survives every later fetch.
[tasks."git:ff-only"]
description = "Refuse to create a merge commit in this clone, and drop refs the remote deleted"
run = [
  "git config --local merge.ff only",
  "git config --local pull.ff only",
  "git config --local fetch.prune true",
]

# --release: a pass over the registry raster takes seconds optimised, minutes not — a debug build here
# is how a timing gets quoted an order of magnitude wrong. `cargo run` is the fast inner loop instead.
[tasks.cli]
description = "Run the popcircles CLI, optimised"
run = "cargo run --release -p popcircles-cli --"

# `--locked` ties the built file to the commit: the release job publishes what this builds, and
# without the flag cargo may update Cargo.lock while building it.
[tasks.build]
description = "Build the release binary from the committed lock, at build/target/release/popcircles"
run = "cargo build --release --locked -p popcircles-cli"

# Not in `lint` or `ci`: it writes a file and asserts nothing about it, the same reason the benchmarks
# are out — not the network, since the basemap is committed and the suite draws complete figures.
[tasks.render]
description = "Render a map from a popcircles JSON document"
run = "uv run render-map"

# Not in `lint` or `ci`: it produces files; regression tests exercise the workflow.
[tasks.map]
description = "Search a named dataset and render its circle map"
run = "uv run circle-map"

# Not in `lint` or `ci` for the same reason as `render`: it writes files. What CI runs on a pull request
# is the suite, which builds this same gallery into a temporary directory and asserts against it — so a
# broken render fails a check without this task being one.
[tasks.gallery]
description = "Render every renderable document in a corpus to a gallery"
run = "uv run render-gallery"

[tasks.fmt]
description = "Format Rust, Python and TOML"
run = [
  "cargo fmt --all",
  "uv run ruff format .",
  "taplo fmt",
]

[tasks."lint:rust"]
description = "Lint Rust with clippy, warnings are errors"
depends = ["deps"]
run = "cargo clippy --all-targets --all-features -- -D warnings"

# `-D warnings`: rustdoc warns and exits 0, so the exit status alone passes a tree with broken links.
# `--document-private-items`: this crate keeps most of its reasoning in private doc comments, unread
# otherwise. Two invocations, not one `--workspace`: the binary and library share the crate name
# `popcircles` (cargo#6313), so a shared `--target-dir` has the second run delete what the first wrote.
[tasks."lint:rustdoc"]
description = "Lint rustdoc, broken intra-doc links are errors"
depends = ["deps"]
env = { RUSTDOCFLAGS = "-D warnings" }
run = [
  "cargo doc -p popcircles --no-deps --document-private-items",
  "cargo doc -p popcircles-cli --no-deps --document-private-items --target-dir {{config_root}}/build/target/doc-cli",
]

[tasks."lint:python"]
description = "Lint Python with ruff"
depends = ["deps"]
run = "uv run ruff check ."

[tasks."lint:workflows"]
description = "Lint GitHub Actions workflows"
run = "actionlint"

# CI never runs prek, so a hook selected by id here and put in `lint`'s depends is what keeps
# .pre-commit-config.yaml the only implementation. --all-files, not the staged set: nothing is staged
# on a CI checkout. Three hooks, one subject: what may be a file in this tree at all.
[tasks."lint:data"]
description = "Check geo data has a registry row, no large blob is committed, and no image is"
run = "prek run --all-files check-added-large-files geo-data-registered no-committed-images"

# See `lint:data` for why. These hooks rewrite rather than check, so a CI failure here reads "files
# were modified" rather than naming the diff — still enough to stop the merge.
[tasks."lint:format"]
description = "Check Rust, TOML and Python are formatted"
run = "prek run --all-files cargo-fmt taplo-fmt ruff-format"

# See `lint:data` for why. Matters more here: one hook stands in for `unsafe_code = "forbid"`, so a
# branch from a clone where `prek install` never ran has to meet it too.
[tasks."lint:exemptions"]
description = "Check what may silence a lint: the one unsafe exception, and no blanket #![allow] in src"
run = "prek run --all-files single-unsafe-allow no-blanket-allow"

# Same shape as `lint:data`: CI never runs prek on its own, and this is what puts the hook there.
[tasks."lint:markdown"]
description = "Lint Markdown with markdownlint-cli2"
run = "prek run --all-files markdownlint-cli2"

# Same shape as `lint:data`: CI never runs prek on its own, and this is what puts the hook there.
[tasks."lint:cspell"]
description = "Spell-check every tracked file with cspell"
run = "prek run --all-files cspell"

# Same shape as `lint:data`: CI never runs prek on its own, and this is what puts the hook there.
[tasks."lint:docs"]
description = "Check pointers and the Structure tree with the lint-docs entry point"
depends = ["deps"]
run = "prek run --all-files doc-pointers"

[tasks.lint]
description = "Run every linter"
depends = [
  "lint:rust",
  "lint:rustdoc",
  "lint:python",
  "lint:workflows",
  "lint:data",
  "lint:format",
  "lint:exemptions",
  "lint:markdown",
  "lint:cspell",
  "lint:docs",
]

[tasks.typecheck]
description = "Type-check Rust and Python"
depends = ["typecheck:rust", "typecheck:python"]

[tasks."typecheck:rust"]
description = "Type-check Rust"
depends = ["deps"]
run = "cargo check --all-targets --all-features"

[tasks."typecheck:python"]
description = "Type-check Python with pyright"
depends = ["deps"]
run = "uv run pyright"

[tasks.test]
description = "Run the Rust and Python test suites"
depends = ["test:python", "test:rust"]

[tasks."test:rust"]
description = "Run the Rust test suite"
depends = ["deps"]
run = "cargo test --all-features"

[tasks."test:python"]
description = "Run the Python test suite"
depends = ["deps"]
run = "uv run pytest"

# Never in `test`: a CI checkout has no raster, and a length assertion against it would fail for
# having no file. `-m` overrides pyproject.toml's addopts, the way `--ignored` selects Rust's.
[tasks."test:python-raster"]
description = "Check the registry's fetched rows against the files on disk (needs the raster present)"
run = "uv run pytest -m raster"

# Never in `ci`: a checkout has no raster to read. Select only this target so the other ignored
# tests stay with their own tasks; --release matters because this reads 933 120 000 cells.
[tasks."test:raster"]
description = "Check the real population raster reader (needs mise run data:get)"
run = "cargo test --release --all-features --test registry_raster -- --ignored"

# Not in `test` or `ci`, for time rather than for data: the shape is 933 120 000 cells and the pass
# takes twenty seconds in release, minutes in a debug build, and a suite that slow stops being run.
# Selected by target rather than by name so adding a second slow test to the file needs no change here.
[tasks."test:slow"]
description = "Check the full-resolution summation table against an exact reference"
run = "cargo test --release --all-features --test full_resolution_table -- --ignored"

# Not in `test`, for time: 74.7 MB and a whole-globe search. Pins that the bound prunes at a size
# where pruning is the difference between seconds and hours — a claim about the algorithm, not a
# wall clock, which is why it is a test and not a benchmark.
[tasks."test:search"]
description = "Search the decimated grid's shape and check the bound prunes most of the globe"
run = "cargo test --release --all-features --test decimated_search -- --ignored"

# Not in `test`, for time: 74.7 MB streamed through the build. Pins that `smallest`'s predicate slack
# bounds the fold's real error at a world's magnitude, where the sums round — a fixture small enough
# for the default suite has every partial sum exact, with nothing to measure.
[tasks."test:fold"]
description = "Measure the circle fold's error at magnitude against the predicate slack it is bounded by"
run = "cargo test --release --all-features --test fold_at_magnitude -- --ignored"

# Not in `test`: reads the registry raster, absent on a CI checkout. The end-to-end one — table,
# search, checked against published prior art — and it skips with a message rather than failing when
# the raster is absent, harmless on a fresh clone.
[tasks."test:validate"]
description = "Search the real raster for half the world and check it against the published result"
run = "cargo test --release --all-features --test registry_validation -- --ignored"

# None of the four are in `ci`: a benchmark measures and asserts nothing, and a figure from a shared
# runner would be noise quoted to three digits. Each is `harness = false` with `std::time::Instant`.
[tasks."bench:table"]
description = "Measure the summation table build, compensation and payload write separately"
run = "cargo bench --bench table_build"

[tasks."bench:kernel"]
description = "Measure circular kernel construction, the only step computing geodesic distance"
run = "cargo bench --bench kernel"

# Reports a resident figure always and a mapped one only when a full-resolution table is under `out/`,
# which it names the command for rather than building behind the caller. The pair is the point: at 7.5 GB
# a four-corner query is a page fault, and the resident figure alone describes a run nobody has.
[tasks."bench:circle"]
description = "Measure circle evaluation, resident and through a mapped full-resolution table"
run = "cargo bench --bench circle"

# `run` steps, not `depends`: parallel resolution would contend for cores and page cache — measured,
# the kernel numbers moved by more than a factor of two between a solo run and a concurrent one.
# `bench:table` stays out: it writes a 7.5 GB payload, and a task that runs everything should not
# be the one that fills a disk.
[tasks.bench]
description = "Run the benchmarks that write nothing, one at a time"
run = ["mise run bench:kernel", "mise run bench:circle"]

[tasks.ci]
description = "Run everything CI runs, locally"
depends = ["lint", "typecheck", "test"]

# Not in `ci`: dispatches a workflow and waits ten minutes on two runners, a thing asked for before a
# tag rather than paid by every pull request. Builds origin's ref, so it refuses a branch behind this
# tree. Proves the release build compiles for `aarch64-apple-darwin`; does not prove the publish path.
[tasks."release:smoke"]
description = "Compile both release legs on demand, macOS included, publishing nothing"
run = "uv run release-smoke"

# Not in `ci`: authorization reads current GitHub identity and release state over the network.
[tasks."release:trust"]
description = "Verify release authorization against the designated GitHub account"
run = "uv run release-trust"

# Not in `lint`, `test` or `ci`, and no later change can put it there: it reaches the network, and a CI
# checkout deliberately has no raster.
[tasks."data:get"]
description = "Fetch every registered dataset not already present, verifying before it is placed"
run = "uv run fetch-data"

# Not in `lint`, `test` or `ci`, and no later change can put it there: it needs the raster and one
# full-resolution search of about ninety minutes.
# The ledgers go first: a resumed run answers the same but reports `radii_evaluated: 0`, which describes
# nothing that happened.
[tasks."results:build"]
description = "Regenerate the committed result documents from the raster (needs mise run data:get)"
run = '''
#!/usr/bin/env bash
# Regenerate the result corpus. Usage: mise run results:build (after mise run data:get).
set -euo pipefail

main() {
  local dataset=population-count-2020-30arcsec
  local scratch
  mkdir -p tmp/gh-73
  scratch=$(mktemp -d tmp/gh-73/results-build.XXXXXX)
  build_coarse_results "$dataset" "$scratch"
  build_full_result "$dataset" "$scratch"
}

build_coarse_results() {
  local dataset="$1"
  local scratch="$2"
  local coarse_table=(--dataset "$dataset" --decimate 10 --cache "$scratch/gpw-5arcmin")
  mise run cli -- table build "${coarse_table[@]}" > /dev/null
  mise run cli -- sweep "${coarse_table[@]}" --from 10 --to 100 --step 10 --spacing 256 \
    --ledger "$scratch/corpus-5arcmin.json" > results/world-sweep-10-to-100-5arcmin.json
  mise run cli -- most-populous "${coarse_table[@]}" --radius-km 1000 --spacing 256 \
    > results/world-most-populous-1000km-5arcmin.json
}

build_full_result() {
  local dataset="$1"
  local scratch="$2"
  mise run cli -- table build --dataset "$dataset" --cache "$scratch/gpw-30arcsec" > /dev/null
  mise run cli -- smallest-for-share --dataset "$dataset" --cache "$scratch/gpw-30arcsec" --share 50 \
    --spacing 2700 --ledger "$scratch/flagship-30arcsec.json" > results/world-half-30arcsec.json
}

main "$@"
'''
